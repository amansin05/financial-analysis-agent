<svg width="720" height="560" viewBox="0 0 720 560" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif">
<style>
.th{font-size:13px;font-weight:600;fill:#1a1a1a}
.ts{font-size:12px;fill:#555}
.it{font-size:11px;fill:#888;font-style:italic}
.arr{stroke:#888;stroke-width:1.5;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.5"/></marker></defs>

<rect x="30" y="30" width="280" height="58" rx="8" fill="#e8f0fe" stroke="#9bb8e8"/>
<text class="th" x="170" y="52" text-anchor="middle">EDGAR · XBRL</text>
<text class="ts" x="170" y="71" text-anchor="middle">exact tagged numbers (the truth)</text>
<line x1="170" y1="88" x2="170" y2="208" class="arr" marker-end="url(#a)"/>
<text class="it" x="182" y="148">trusted figures</text>

<rect x="390" y="30" width="280" height="58" rx="8" fill="#e7f3ea" stroke="#9ccaa6"/>
<text class="th" x="530" y="52" text-anchor="middle">Stored segment text (SQLite)</text>
<text class="ts" x="530" y="71" text-anchor="middle">the triage output — words, not numbers</text>
<line x1="530" y1="88" x2="530" y2="108" class="arr" marker-end="url(#a)"/>

<rect x="390" y="110" width="280" height="58" rx="8" fill="#e6f4f1" stroke="#8fc7bb"/>
<text class="th" x="530" y="132" text-anchor="middle">LLM extracts numbers</text>
<text class="ts" x="530" y="151" text-anchor="middle">reads text → candidate figures</text>
<line x1="530" y1="168" x2="530" y2="208" class="arr" marker-end="url(#a)"/>
<text class="it" x="542" y="188">proposed figures</text>

<rect x="200" y="210" width="300" height="66" rx="8" fill="#fdf3e3" stroke="#e8c98f"/>
<text class="th" x="350" y="233" text-anchor="middle">RECONCILE — compare the two</text>
<text class="ts" x="350" y="254" text-anchor="middle">XBRL truth  vs  LLM candidates</text>

<line x1="280" y1="276" x2="240" y2="330" class="arr" marker-end="url(#a)"/>
<line x1="420" y1="276" x2="460" y2="330" class="arr" marker-end="url(#a)"/>

<rect x="90" y="332" width="240" height="58" rx="8" fill="#e7f3ea" stroke="#9ccaa6"/>
<text class="th" x="210" y="354" text-anchor="middle">Match → trusted</text>
<text class="ts" x="210" y="373" text-anchor="middle">number confirmed</text>

<rect x="370" y="332" width="240" height="58" rx="8" fill="#fdecea" stroke="#eaa79c"/>
<text class="th" x="490" y="354" text-anchor="middle">Mismatch → flagged</text>
<text class="ts" x="490" y="373" text-anchor="middle">not trusted, raised</text>

<line x1="210" y1="390" x2="320" y2="440" class="arr" marker-end="url(#a)"/>
<line x1="490" y1="390" x2="380" y2="440" class="arr" marker-end="url(#a)"/>

<rect x="220" y="442" width="260" height="58" rx="8" fill="#f0e9f7" stroke="#c3a8df"/>
<text class="th" x="350" y="464" text-anchor="middle">Stored in financials</text>
<text class="ts" x="350" y="483" text-anchor="middle">+ citation back to segment</text>

<rect x="510" y="442" width="150" height="58" rx="8" fill="#f4f3f0" stroke="#cfccc4" stroke-dasharray="4 3"/>
<text class="ts" x="585" y="464" text-anchor="middle">Summary</text>
<text class="it" x="585" y="482" text-anchor="middle">NOT involved</text>
</svg>
