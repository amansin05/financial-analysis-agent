<svg width="720" height="660" viewBox="0 0 720 660" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif">
<style>
.th{font-size:13px;font-weight:600;fill:#1a1a1a}
.ts{font-size:12px;fill:#555}
.it{font-size:11px;fill:#888;font-style:italic}
.arr{stroke:#888;stroke-width:1.5;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.5"/></marker></defs>

<rect x="14" y="14" width="692" height="250" rx="10" fill="none" stroke="#ccc" stroke-dasharray="4 4"/>
<text class="it" x="28" y="34">BUILD TIME — extract edges (entities.extract)</text>

<rect x="260" y="46" width="200" height="48" rx="8" fill="#e7f3ea" stroke="#9ccaa6"/>
<text class="th" x="360" y="64" text-anchor="middle">SQLite segments</text>
<text class="ts" x="360" y="82" text-anchor="middle">stored call text</text>
<line x1="360" y1="94" x2="360" y2="110" class="arr" marker-end="url(#a)"/>

<rect x="250" y="112" width="220" height="56" rx="8" fill="#e6f4f1" stroke="#8fc7bb"/>
<text class="th" x="360" y="132" text-anchor="middle">LLM extracts entities</text>
<text class="ts" x="360" y="151" text-anchor="middle">topics · mentions · execs</text>
<line x1="360" y1="168" x2="360" y2="184" class="arr" marker-end="url(#a)"/>

<rect x="250" y="186" width="220" height="48" rx="8" fill="#fdecea" stroke="#eaa79c"/>
<text class="th" x="360" y="204" text-anchor="middle">canonicalize topics</text>
<text class="ts" x="360" y="222" text-anchor="middle">merge synonyms → one label</text>
<line x1="470" y1="210" x2="540" y2="210" class="arr" marker-end="url(#a)"/>

<rect x="540" y="150" width="160" height="96" rx="8" fill="#f0e9f7" stroke="#c3a8df"/>
<text class="th" x="620" y="170" text-anchor="middle">SQLite edges</text>
<text class="ts" x="620" y="190" text-anchor="middle">mentions · topics</text>
<text class="ts" x="620" y="207" text-anchor="middle">executive_tenure</text>
<text class="ts" x="620" y="224" text-anchor="middle">analyst_coverage</text>

<rect x="14" y="278" width="692" height="368" rx="10" fill="none" stroke="#ccc" stroke-dasharray="4 4"/>
<text class="it" x="28" y="298">USE TIME — read on demand</text>

<rect x="270" y="310" width="180" height="48" rx="8" fill="#f0e9f7" stroke="#c3a8df"/>
<text class="th" x="360" y="328" text-anchor="middle">SQLite edges + sentiment</text>
<text class="ts" x="360" y="346" text-anchor="middle">the stored truth</text>

<line x1="300" y1="358" x2="190" y2="398" class="arr" marker-end="url(#a)"/>
<line x1="420" y1="358" x2="530" y2="398" class="arr" marker-end="url(#a)"/>
<text class="it" x="195" y="382" text-anchor="middle">graph path</text>
<text class="it" x="560" y="382" text-anchor="middle">monitor path</text>

<rect x="50" y="400" width="280" height="50" rx="8" fill="#fdf3e3" stroke="#e8c98f"/>
<text class="th" x="190" y="419" text-anchor="middle">build NetworkX in memory</text>
<text class="ts" x="190" y="437" text-anchor="middle">load edges → graph</text>
<line x1="190" y1="450" x2="190" y2="488" class="arr" marker-end="url(#a)"/>

<rect x="50" y="490" width="280" height="64" rx="8" fill="#fdecea" stroke="#eaa79c"/>
<text class="th" x="190" y="510" text-anchor="middle">analyze the graph</text>
<text class="ts" x="190" y="530" text-anchor="middle">propagation · centrality</text>
<text class="ts" x="190" y="546" text-anchor="middle">communities · shared topics</text>
<line x1="190" y1="554" x2="190" y2="586" class="arr" marker-end="url(#a)"/>
<text class="ts" x="190" y="600" text-anchor="middle">→ /graph · /theme · /shared</text>
<text class="it" x="190" y="624" text-anchor="middle">graph is discarded after — rebuilt each time</text>

<rect x="430" y="400" width="240" height="50" rx="8" fill="#fdecea" stroke="#eaa79c"/>
<text class="th" x="550" y="419" text-anchor="middle">read negative sentiment</text>
<text class="ts" x="550" y="437" text-anchor="middle">plain SQLite query</text>
<line x1="550" y1="450" x2="550" y2="500" class="arr" marker-end="url(#a)"/>
<rect x="430" y="502" width="240" height="50" rx="8" fill="#f4f3f0" stroke="#cfccc4"/>
<text class="th" x="550" y="521" text-anchor="middle">Alerts</text>
<text class="ts" x="550" y="539" text-anchor="middle">→ /alerts (no LLM)</text>
<text class="it" x="550" y="586" text-anchor="middle">backfilled history →</text>
<text class="it" x="550" y="606" text-anchor="middle">theme propagation over time</text>
</svg>
